<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Currency Duo - Fridge Combo</title>
    <link rel="apple-touch-icon" href="image_24.png">
    <link rel="icon" type="image/png" href="image_24.png">
    <style>
        :root {
            --bg: #fff;
            --main: #333;
            --accent: #eee;
            --input-bg: #fafafa;
            --radius: 15px;
            --placeholder: #bbb;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; padding: 0;
            touch-action: manipulation; 
        }

        body {
            background-color: var(--bg); color: var(--main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: calc(env(safe-area-inset-top, 20px) + 10px) 20px env(safe-area-inset-bottom, 20px);
        }

        .fridge-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; flex-grow: 1; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }

        .hub-link {
            text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main);
            background: var(--accent); padding: 8px 12px; border-radius: 10px;
        }

        .converter-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0; margin-bottom: 20px; }
        
        .currency-item { 
            width: 100%; background: var(--input-bg); border: 1px solid var(--accent); 
            border-radius: var(--radius); padding: 20px;
        }

        .currency-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        
        select {
            background: var(--main); color: #fff; border: none; border-radius: 10px;
            padding: 8px 12px; font-size: 0.85rem; font-weight: bold; outline: none;
            -webkit-appearance: none; cursor: pointer; max-width: 220px;
        }

        .clr-btn {
            background: #777; color: #fff; border: none; border-radius: 10px;
            padding: 8px 15px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
        }
        .clr-btn:active { opacity: 0.8; }

        input {
            width: 100%; border: none; background: transparent; color: var(--main);
            font-size: 2.2rem; font-weight: 800; text-align: right; outline: none;
            -webkit-appearance: none; -webkit-text-fill-color: var(--main); opacity: 1 !important;
        }
        input::placeholder { color: var(--placeholder); -webkit-text-fill-color: var(--placeholder); }

        .approx-value { font-size: 0.85rem; color: #bbb; text-align: right; font-weight: 800; height: 1.2rem; }
        .sync-info { font-size: 0.6rem; color: #ccc; font-weight: 800; text-transform: uppercase; margin-top: 10px; text-align: center; letter-spacing: 0.5px; }

        .swap-divider { 
            width: 44px; height: 44px; background: #fff; border: 2px solid var(--accent); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; margin: -22px 0; z-index: 10; cursor: pointer; 
        }
        .swap-divider:active { transform: scale(0.9) rotate(180deg); background: var(--accent); }

        .footer-btns { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 0 30px; }
        .kofi-btn, .home-btn {
            width: 100%; max-width: 250px; padding: 14px; border-radius: var(--radius);
            font-weight: 800; font-size: 0.9rem; text-decoration: none; text-align: center; border: none; cursor: pointer;
        }
        .kofi-btn { background: #fff; color: var(--main); border: 2px solid var(--main); }
        .home-btn { background: var(--accent); color: var(--main); }

        footer { font-size: 0.75rem; color: #bbb; text-align: center; padding-bottom: 20px; font-weight: 600; line-height: 1.6; }
        footer a { color: inherit; text-decoration: underline; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: var(--radius); width: 85%; max-width: 320px; position: relative; }
        .close-icon { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; color: #aaa; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="fridge-container">
    <header>
        <h1>Currency Duo</h1>
        <a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a>
    </header>

    <div class="converter-box">
        <div class="currency-item">
            <div class="currency-row">
                <select id="currencyA"></select>
                <button class="clr-btn" id="clrA">Clr</button>
            </div>
            <input type="text" id="inputA" placeholder="0" inputmode="decimal">
            <div class="approx-value" id="roundA"></div>
        </div>

        <div class="swap-divider" id="swapBtn">⇄</div>

        <div class="currency-item">
            <div class="currency-row">
                <select id="currencyB"></select>
                <button class="clr-btn" id="clrB">Clr</button>
            </div>
            <input type="text" id="inputB" placeholder="0" inputmode="decimal">
            <div class="approx-value" id="roundB"></div>
        </div>
    </div>

    <div class="sync-info" id="syncStatus">Fetching latest rates...</div>

    <div class="footer-btns">
        <a href="https://ko-fi.com/afrorakda" target="_blank" class="kofi-btn">☕️ Buy me a coffee</a>
        <button class="home-btn" id="homeBtn">Add to Home Screen</button>
    </div>

    <footer id="dynamicFooter">
        No login / No tracking / No ads / Browser only<br>
        <a href="https://afrorakda.com/privacy/">Privacy Policy</a><br>
        afrorakda © 2026
    </footer>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-icon" id="closeModal">&times;</span>
        <h3 style="margin-top:0; font-weight:800">📱 Install</h3>
        <p style="margin: 15px 0; color: #666; font-size: 0.9rem;">Add to your home screen for instant use.</p>
        <div style="text-align: left; font-size: 0.9rem; line-height: 1.6;">
            <p>🍏 <b>iPhone (Safari):</b><br>Share > Add to Home Screen</p><br>
            <p>🤖 <b>Android (Chrome):</b><br>Menu (⋮) > Add to home screen</p>
        </div>
    </div>
</div>

<script>
    const currencyData = [
        {c:"USD", n:"US Dollar"}, {c:"EUR", n:"Euro"}, {c:"JPY", n:"Japanese Yen"}, 
        {c:"GBP", n:"British Pound"}, {c:"AUD", n:"Australian Dollar"}, {c:"CAD", n:"Canadian Dollar"}, 
        {c:"CHF", n:"Swiss Franc"}, {c:"CNY", n:"Chinese Yuan"}, {c:"HKD", n:"Hong Kong Dollar"}, 
        {c:"IDR", n:"Indonesian Rupiah"}, {c:"INR", n:"Indian Rupee"}, {c:"KRW", n:"South Korean Won"}, 
        {c:"MYR", n:"Malaysian Ringgit"}, {c:"NZD", n:"NZ Dollar"}, {c:"PHP", n:"Philippine Peso"}, 
        {c:"SGD", n:"Singapore Dollar"}, {c:"THB", n:"Thai Baht"}, {c:"TWD", n:"Taiwan Dollar"}, {c:"VND", n:"Vietnamese Dong"}
    ];

    const selA = document.getElementById('currencyA');
    const selB = document.getElementById('currencyB');
    const inA = document.getElementById('inputA');
    const inB = document.getElementById('inputB');
    const status = document.getElementById('syncStatus');
    let rates = JSON.parse(localStorage.getItem('fcombo_rates')) || {};

    currencyData.forEach(item => {
        selA.add(new Option(`${item.c} - ${item.n}`, item.c));
        selB.add(new Option(`${item.c} - ${item.n}`, item.c));
    });

    selA.value = localStorage.getItem('fcombo_curA') || 'MYR';
    selB.value = localStorage.getItem('fcombo_curB') || 'JPY';

    async function fetchRates() {
        try {
            const res = await fetch(`https://open.er-api.com/v6/latest/USD`);
            const data = await res.json();
            if (data.result === "success") {
                rates = data.rates;
                localStorage.setItem('fcombo_rates', JSON.stringify(rates));
                status.textContent = `Synced: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            }
        } catch (e) {
            status.textContent = rates.USD ? "Using cached rates" : "Offline mode";
        }
    }

    function parseInput(val) { return parseFloat(val.replace(/,/g, '')); }
    function displayFormat(num) {
        if (num === 0) return "0";
        if (!num || isNaN(num)) return "";
        return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(num);
    }

    function convert(val, from, to) {
        if (!rates[from] || !rates[to]) return "";
        return (val / rates[from]) * rates[to];
    }

    function update(e) {
        let rawVal = parseInput(e.target.value);
        if (isNaN(rawVal)) { e.target.value = ""; rawVal = 0; }
        e.target.value = displayFormat(rawVal);

        if (e.target === inA) {
            const res = convert(rawVal, selA.value, selB.value);
            inB.value = displayFormat(res);
            document.getElementById('roundB').textContent = res ? `≈ ${Math.round(res).toLocaleString()}` : "";
            document.getElementById('roundA').textContent = ""; 
        } else {
            const res = convert(rawVal, selB.value, selA.value);
            inA.value = displayFormat(res);
            document.getElementById('roundA').textContent = res ? `≈ ${Math.round(res).toLocaleString()}` : "";
            document.getElementById('roundB').textContent = "";
        }
    }

    inA.oninput = update;
    inB.oninput = update;
    document.getElementById('clrA').onclick = () => { inA.value = ""; inB.value = ""; inA.focus(); };
    document.getElementById('clrB').onclick = () => { inA.value = ""; inB.value = ""; inB.focus(); };
    selA.onchange = () => { localStorage.setItem('fcombo_curA', selA.value); inA.dispatchEvent(new Event('input')); };
    selB.onchange = () => { localStorage.setItem('fcombo_curB', selB.value); inA.dispatchEvent(new Event('input')); };
    document.getElementById('swapBtn').onclick = () => {
        const temp = selA.value; selA.value = selB.value; selB.value = temp;
        localStorage.setItem('fcombo_curA', selA.value); localStorage.setItem('fcombo_curB', selB.value);
        inA.dispatchEvent(new Event('input'));
    };

    document.getElementById('homeBtn').onclick = () => document.getElementById('modal').style.display = 'flex';
    document.getElementById('closeModal').onclick = () => document.getElementById('modal').style.display = 'none';

    async function loadFooter() {
        try {
            const res = await fetch('footer.json');
            if (res.ok) {
                const data = await res.json();
                if (data.footerHtml) document.getElementById('dynamicFooter').innerHTML = data.footerHtml;
            }
        } catch(e) {}
    }
    window.onload = loadFooter;
    fetchRates().then(() => { 
        inA.value = "100"; inA.dispatchEvent(new Event('input')); 
        inA.focus(); // 開いた瞬間にオートフォーカス
    });
</script>

</body>
</html>
